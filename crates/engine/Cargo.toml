[package]
name = "spacetimedb-engine"
version.workspace = true
edition.workspace = true
license-file = "LICENSE"
description = "Database engine and local persistence runtime for SpacetimeDB"
rust-version.workspace = true

[lints]
workspace = true

[features]
# Everything but `sql` (the row-level security compiler): the database runtime, its
# persistence, metrics and Tokio. Off for wasm32, where only `sql` builds.
native = [
    "dep:async-trait",
    "dep:enum-map",
    "dep:futures",
    "dep:hex",
    "dep:itertools",
    "dep:log",
    "dep:once_cell",
    "dep:parking_lot",
    "dep:prometheus",
    "dep:serde",
    "dep:sled",
    "dep:spacetimedb-commitlog",
    "dep:spacetimedb-data-structures",
    "dep:spacetimedb-durability",
    "dep:spacetimedb-fs-utils",
    "dep:spacetimedb-metrics",
    "dep:spacetimedb-paths",
    "dep:spacetimedb-runtime",
    "dep:spacetimedb-snapshot",
    "dep:spacetimedb-table",
    "dep:sqlparser",
    "dep:tempfile",
    "dep:thiserror",
    "dep:tracing",
    "spacetimedb-datastore/default",
    "spacetimedb-lib/metrics_impls",
]
default = ["native"]
test = ["native", "spacetimedb-commitlog/test", "spacetimedb-datastore/test"]

[dependencies]
anyhow = { workspace = true, features = ["backtrace"] }
async-trait = { workspace = true, optional = true }
enum-map = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
itertools = { workspace = true, optional = true }
log = { workspace = true, optional = true }
once_cell = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
prometheus = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
sled = { workspace = true, optional = true }
spacetimedb-commitlog = { workspace = true, optional = true }
spacetimedb-data-structures = { workspace = true, optional = true }
spacetimedb-datastore = { path = "../datastore", version = "=2.16.0", default-features = false }
spacetimedb-durability = { workspace = true, optional = true }
spacetimedb-expr.workspace = true
spacetimedb-fs-utils = { workspace = true, optional = true }
spacetimedb-lib = { workspace = true, features = ["serde"] }
spacetimedb-metrics = { workspace = true, optional = true }
spacetimedb-paths = { workspace = true, optional = true }
spacetimedb-primitives.workspace = true
spacetimedb-runtime = { workspace = true, optional = true }
spacetimedb-sats = { workspace = true, features = ["serde"] }
spacetimedb-schema.workspace = true
spacetimedb-snapshot = { workspace = true, optional = true }
spacetimedb-table = { workspace = true, optional = true }
sqlparser = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
bytes.workspace = true
env_logger.workspace = true
fs_extra.workspace = true
pretty_assertions.workspace = true
spacetimedb-commitlog = { path = "../commitlog", features = ["test"] }
spacetimedb-datastore = { path = "../datastore", features = ["test"] }
spacetimedb-schema = { path = "../schema", features = ["test"] }
tokio.workspace = true
